<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Iniciar sesión — CanchaGo</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green:   #22c55e;
      --green-d: #16a34a;
      --dark:    #0a0f1e;
      --card:    #111827;
      --card2:   #1f2937;
      --border:  #1f2937;
      --border2: #374151;
      --muted:   #9ca3af;
      --text:    #f9fafb;
      --red:     #ef4444;
      --radius:  14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .logo {
      display: flex; align-items: center; gap: .5rem;
      text-decoration: none;
      margin-bottom: 2rem;
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--green);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #000;
    }
    .logo-text { font-weight: 800; font-size: 1.2rem; color: var(--green); letter-spacing: -.02em; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 400px;
    }

    .card-title {
      font-size: 1.3rem; font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: .35rem;
    }
    .card-sub {
      font-size: .85rem; color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    label { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    input[type="email"],
    input[type="password"] {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      padding: .65rem .9rem;
      width: 100%;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: var(--green); }
    input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 9px;
      padding: .75rem;
      font-family: inherit;
      font-size: .95rem; font-weight: 700;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:hover { background: var(--green-d); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      color: var(--red);
      font-size: .82rem;
      padding: .6rem .85rem;
      margin-top: .75rem;
    }
    .error-msg.show { display: block; }

    .footer-links {
      margin-top: 1.5rem;
      font-size: .82rem;
      color: var(--muted);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .footer-links a { color: var(--green); text-decoration: none; font-weight: 600; }
    .footer-links a:hover { text-decoration: underline; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

  <a href="index.html" class="logo">
    <div class="logo-mark">C</div>
    <span class="logo-text">CanchaGo</span>
  </a>

  <div class="card">
    <div class="card-title">Bienvenido de nuevo</div>
    <div class="card-sub">Ingresa a tu panel de dueño de cancha</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="btn-primary" id="submitBtn">Ingresar al panel</button>
    </form>

    <hr class="divider" />

    <div class="footer-links">
      <span>¿No tienes cuenta? <a href="registro.html">Registra tu cancha gratis</a></span>
      <span><a href="index.html">← Volver al inicio</a></span>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const sb = supabase.createClient(
    'https://xqklrfzhpywbyxhskvtq.supabase.co',
    'sb_publishable_nwWnl9ohsydrFtzmGjJz4A_dGodbr8D'
  );

  // If already logged in, go straight to panel
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'panel.html';
  });

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'Ingresando…';
    errorEl.classList.remove('show');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Ingresar al panel';
      errorEl.textContent = error.message.includes('Invalid login')
        ? 'Correo o contraseña incorrectos'
        : error.message;
      errorEl.classList.add('show');
      return;
    }

    window.location.href = 'panel.html';
  }
</script>
</body>
</html>
